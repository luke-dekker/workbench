[project]
name = "workbench"
version = "0.1.0"
description = "Project registry + launcher for notebooks, engines and languages"
requires-python = ">=3.11"
dependencies = [
    # core: what `import wb` needs inside any project env (kept small on purpose)
    "numpy",
    "pyarrow",
    "safetensors",
    "mcap",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]
win = ["pywin32; sys_platform == 'win32'"]

[dependency-groups]
# the launcher / notebook env (uv sync installs this; --with-editable does not)
dev = [
    "marimo>=0.25",
    "marimo-studio",
    "marimo-lens",
    "polars",
    "jupyterlab",
    "octave-kernel",
    "pystray>=0.19",
    "pillow>=10",
]

[project.scripts]
wb = "wb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wb"]
